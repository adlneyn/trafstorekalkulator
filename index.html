<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Harga Tebar LPM & LPFP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Hubungkan Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 md:p-8">
        
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-indigo-400">Kalkulator Tarif Harga Tebar</h1>
            <p class="text-slate-400 text-sm mt-1">Pilih Mode Tarif (LPM / LPFP), Frekuensi, Grup, Durasi, dan Add-on Opsional.</p>
        </div>

        <div class="space-y-5">
            <!-- Mode / Jenis Tarif -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Mode / Jenis Tarif</label>
                <div class="grid grid-cols-2 gap-3">
                    <button type="button" onclick="setMode('lpm')" id="btn-mode-lpm" class="mode-btn py-3 px-4 rounded-xl border border-slate-600 bg-slate-700 font-semibold text-sm transition hover:border-indigo-500 focus:outline-none">LPM</button>
                    <button type="button" onclick="setMode('lpfp')" id="btn-mode-lpfp" class="mode-btn py-3 px-4 rounded-xl border border-slate-600 bg-slate-700 font-semibold text-sm transition hover:border-indigo-500 focus:outline-none">LPFP</button>
                </div>
            </div>

            <!-- Frekuensi Sebar / Hari -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Frekuensi Sebar / Hari</label>
                <div class="grid grid-cols-3 gap-3">
                    <button type="button" onclick="setFrekuensi(1)" id="btn-freq-1" class="freq-btn py-3 px-4 rounded-xl border border-slate-600 bg-slate-700 font-semibold text-sm transition hover:border-indigo-500 focus:outline-none">1× Sebar</button>
                    <button type="button" onclick="setFrekuensi(2)" id="btn-freq-2" class="freq-btn py-3 px-4 rounded-xl border border-slate-600 bg-slate-700 font-semibold text-sm transition hover:border-indigo-500 focus:outline-none">2× Sebar</button>
                    <button type="button" onclick="setFrekuensi(3)" id="btn-freq-3" class="freq-btn py-3 px-4 rounded-xl border border-slate-600 bg-slate-700 font-semibold text-sm transition hover:border-indigo-500 focus:outline-none">3× Sebar</button>
                </div>
            </div>

            <!-- Jumlah Grup -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Jumlah Grup</label>
                <select id="select-grup" onchange="hitungHarga()" class="w-full bg-slate-700 border border-slate-600 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500">
                    <!-- Diisi otomatis via JavaScript -->
                </select>
            </div>

            <!-- Durasi Hari -->
            <div>
                <label class="block text-sm font-medium text-slate-300 mb-2">Durasi (Hari)</label>
                <div class="grid grid-cols-7 gap-1 md:gap-2" id="hari-container">
                    <!-- Diisi otomatis via JavaScript -->
                </div>
            </div>

            <!-- Fitur Tambahan (Add-on) -->
            <div class="pt-2 border-t border-slate-700">
                <label class="block text-sm font-medium text-slate-300 mb-3">Fitur Tambahan (Add-on)</label>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <!-- Inrush (+100) -->
                    <div class="flex items-center justify-between bg-slate-700/50 border border-slate-600 px-4 py-2.5 rounded-xl">
                        <div>
                            <span class="text-sm font-medium text-slate-200">Inrush</span>
                            <span class="block text-xs text-indigo-400">+100</span>
                        </div>
                        <button type="button" id="addon-inrush" onclick="toggleAddon('inrush')" class="w-12 h-6 flex items-center bg-slate-600 rounded-full p-1 transition duration-300 focus:outline-none">
                            <div id="toggle-inrush" class="bg-white w-4 h-4 rounded-full shadow-md transform transition duration-300"></div>
                        </button>
                    </div>

                    <!-- Store (+100) -->
                    <div class="flex items-center justify-between bg-slate-700/50 border border-slate-600 px-4 py-2.5 rounded-xl">
                        <div>
                            <span class="text-sm font-medium text-slate-200">Store</span>
                            <span class="block text-xs text-indigo-400">+100</span>
                        </div>
                        <button type="button" id="addon-store" onclick="toggleAddon('store')" class="w-12 h-6 flex items-center bg-slate-600 rounded-full p-1 transition duration-300 focus:outline-none">
                            <div id="toggle-store" class="bg-white w-4 h-4 rounded-full shadow-md transform transition duration-300"></div>
                        </button>
                    </div>

                    <!-- Berfoto (+25) -->
                    <div class="flex items-center justify-between bg-slate-700/50 border border-slate-600 px-4 py-2.5 rounded-xl">
                        <div>
                            <span class="text-sm font-medium text-slate-200">Berfoto</span>
                            <span class="block text-xs text-indigo-400">+25</span>
                        </div>
                        <button type="button" id="addon-berfoto" onclick="toggleAddon('berfoto')" class="w-12 h-6 flex items-center bg-slate-600 rounded-full p-1 transition duration-300 focus:outline-none">
                            <div id="toggle-berfoto" class="bg-white w-4 h-4 rounded-full shadow-md transform transition duration-300"></div>
                        </button>
                    </div>

                    <!-- Bervideo (+50) -->
                    <div class="flex items-center justify-between bg-slate-700/50 border border-slate-600 px-4 py-2.5 rounded-xl">
                        <div>
                            <span class="text-sm font-medium text-slate-200">Bervideo</span>
                            <span class="block text-xs text-indigo-400">+50</span>
                        </div>
                        <button type="button" id="addon-bervideo" onclick="toggleAddon('bervideo')" class="w-12 h-6 flex items-center bg-slate-600 rounded-full p-1 transition duration-300 focus:outline-none">
                            <div id="toggle-bervideo" class="bg-white w-4 h-4 rounded-full shadow-md transform transition duration-300"></div>
                        </button>
                    </div>

                    <!-- Fee 1821+ (+100) -->
                    <div class="flex items-center justify-between bg-slate-700/50 border border-slate-600 px-4 py-2.5 rounded-xl sm:col-span-2">
                        <div>
                            <span class="text-sm font-medium text-slate-200">Fee 1821+</span>
                            <span class="block text-xs text-indigo-400">+100</span>
                        </div>
                        <button type="button" id="addon-fee1821" onclick="toggleAddon('fee1821')" class="w-12 h-6 flex items-center bg-slate-600 rounded-full p-1 transition duration-300 focus:outline-none">
                            <div id="toggle-fee1821" class="bg-white w-4 h-4 rounded-full shadow-md transform transition duration-300"></div>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bagian Hasil Total -->
        <div class="mt-6 bg-slate-900/60 border border-indigo-500/30 rounded-2xl p-5 text-center">
            <span class="text-xs uppercase tracking-wider text-slate-400 font-semibold">Estimasi Harga Total</span>
            <div id="result-price" class="text-3xl md:text-4xl font-extrabold text-emerald-400 mt-2">0</div>
            <div id="result-detail" class="text-xs text-slate-400 mt-1">-</div>
        </div>

        <div class="mt-5 text-center">
            <button onclick="toggleTable()" class="text-xs text-indigo-400 hover:underline focus:outline-none">Lihat Tabel Referensi Tarif Lengkap</button>
        </div>
    </div>

    <!-- Modal Tabel Referensi -->
    <div id="modal-table" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-4xl max-h-[80vh] rounded-2xl flex flex-col p-6 shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 id="modal-title-text" class="text-lg font-bold text-slate-200">Tabel Tarif Lengkap</h3>
                <button onclick="toggleTable()" class="text-slate-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <div class="overflow-x-auto flex-1 border border-slate-700 rounded-xl">
                <table class="w-full text-left text-xs text-slate-300">
                    <thead class="bg-slate-700 text-slate-200 uppercase sticky top-0">
                        <tr>
                            <th class="p-3">Grup</th>
                            <th class="p-3">1 H</th>
                            <th class="p-3">2 H</th>
                            <th class="p-3">3 H</th>
                            <th class="p-3">4 H</th>
                            <th class="p-3">5 H</th>
                            <th class="p-3">6 H</th>
                            <th class="p-3">7 H</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-700">
                        <!-- Diisi otomatis via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Hubungkan Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
